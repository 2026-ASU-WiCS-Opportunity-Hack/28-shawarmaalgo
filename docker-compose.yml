services:
  postgres:
    image: postgres:16-alpine
    container_name: shawarmaalgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wial"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/wial?sslmode=disable",
        "up"
      ]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wial?sslmode=disable
      SUPER_ADMIN_EMAIL: admin@example.com
      SUPER_ADMIN_PASSWORD: change-me-in-local-dev
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
