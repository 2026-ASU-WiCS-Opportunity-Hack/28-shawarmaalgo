components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: page_size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed or missing bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks the required role or assignment scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ImageUploadResponse:
      type: object
      properties:
        url: { type: string }
        key: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
      required: [url, key, content_type, size]
    User:
      type: object
      properties:
        id: { type: string }
        email:
          type: string
          format: email
        role:
          type: string
          enum: [super_admin, chapter_lead, coach, content_creator]
        chapter_id:
          type: string
          nullable: true
        chapter_name:
          type: string
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, email, role, created_at, updated_at]
    UserCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [chapter_lead, coach, content_creator]
        chapter_id:
          type: string
      required: [email, password, role, chapter_id]
    UserPatchRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [super_admin, chapter_lead, coach, content_creator]
        chapter_id:
          type: string
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
      required: [data]
    UserLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: '#/components/schemas/User'
      required: [token, user]
    MeResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        chapter:
          allOf:
            - $ref: '#/components/schemas/Chapter'
          nullable: true
      required: [user]
    PortalOverviewStats:
      type: object
      properties:
        coach_count: { type: integer }
        event_count: { type: integer }
