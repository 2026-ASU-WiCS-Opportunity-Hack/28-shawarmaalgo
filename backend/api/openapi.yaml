openapi: 3.0.3
info:
  title: WIAL Backend API
  version: 1.0.0
  description: |
    OpenAPI documentation for the WIAL backend.

    Public auth is login-only. User creation is restricted to authenticated
    administrators through the managed users endpoint.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Chapters
  - name: Coaches
  - name: Events
  - name: AI
  - name: Payments
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in a user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid credentials
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users:
    post:
      tags: [Users]
      summary: Create a managed user
      description: |
        Creates a `chapter_lead`, `coach`, or `content_creator`.
        `super_admin` users are bootstrapped from env only and cannot be created through the API.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request, invalid role, or missing chapter assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: email already exists
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/chapters:
    get:
      tags: [Chapters]
      summary: List chapters
      operationId: listChapters
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: region
          schema:
            type: string
        - in: query
          name: language
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of chapters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Chapters]
      summary: Create a chapter
      description: Super-admin only. Each country can have only one chapter.
      operationId: createChapter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterCreateRequest'
      responses:
        '201':
          description: Chapter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Chapter slug or country already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: country already exists
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/chapters/{id}:
    get:
      tags: [Chapters]
      summary: Get a chapter by ID
      operationId: getChapter
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Chapter found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Chapters]
      summary: Replace a chapter
      description: Each country can have only one chapter.
      operationId: updateChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterUpdateRequest'
      responses:
        '200':
          description: Chapter updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Chapter slug or country already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: country already exists
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Chapters]
      summary: Patch a chapter
      description: Super-admin global access; chapter leads are limited to their own chapter. Each country can have only one chapter.
      operationId: patchChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterPatchRequest'
      responses:
        '200':
          description: Chapter patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          description: Invalid request or no fields to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Chapter slug or country already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: country already exists
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Chapters]
      summary: Delete a chapter
      description: Super-admin global access; chapter leads are limited to their own chapter.
      operationId: deleteChapter
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Chapter deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/chapters/{id}/content:
    patch:
      tags: [Chapters]
      summary: Patch chapter page content
      description: Content creators can edit only their own chapter. Super-admins can edit any chapter.
      operationId: patchChapterContent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterContentUpdateRequest'
      responses:
        '200':
          description: Chapter content updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          description: Invalid request or no fields to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/coaches:
    get:
      tags: [Coaches]
      summary: List coaches
      operationId: listCoaches
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: chapter_id
          schema:
            type: string
        - in: query
          name: certification_level
          schema:
            type: string
        - in: query
          name: language
          schema:
            type: string
        - in: query
          name: specialization
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of coaches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/coaches/{id}:
    get:
      tags: [Coaches]
      summary: Get a coach by ID
      description: Public coach profile endpoint.
      operationId: getCoach
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Coach found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coach'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Coaches]
      summary: Create a coach profile
      description: Super-admin global access; chapter leads are limited to their own chapter.
      operationId: createCoach
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachCreateRequest'
      responses:
        '201':
          description: Coach created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coach'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events:
    get:
      tags: [Events]
      summary: List events
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: chapter_id
          schema:
            type: string
        - in: query
          name: event_type
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Events]
      summary: Create an event
      description: Super-admin global access; chapter leads are limited to their own chapter.
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/ai/coach-search:
    get:
      tags: [AI]
      summary: Search coaches using the simulated AI endpoint
      operationId: aiCoachSearch
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Coach search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AICoachSearchResponse'
        '400':
          description: Query parameter is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Search failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/ai/generate-chapter:
    post:
      tags: [AI]
      summary: Generate starter chapter content
      operationId: aiGenerateChapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGenerateChapterRequest'
      responses:
        '200':
          description: Generated chapter content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIGenerateChapterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/payments/create-session:
    post:
      tags: [Payments]
      summary: Create a simulated checkout session
      operationId: createCheckoutSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutSessionRequest'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      in: query
      name: page_size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed or missing bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks the required role or assignment scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    User:
      type: object
      properties:
        id: { type: string }
        email:
          type: string
          format: email
        role:
          type: string
          enum: [super_admin, chapter_lead, coach, content_creator]
        chapter_id:
          type: string
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, email, role, created_at, updated_at]
    UserCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [chapter_lead, coach, content_creator]
        chapter_id:
          type: string
      required: [email, password, role, chapter_id]
    UserLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: '#/components/schemas/User'
      required: [token, user]
    Chapter:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        country: { type: string }
        region: { type: string }
        description: { type: string, nullable: true }
        description_local: { type: string, nullable: true }
        primary_language: { type: string }
        supported_languages:
          type: array
          items: { type: string }
        timezone: { type: string }
        currency: { type: string }
        contact_email:
          type: string
          format: email
        website_url: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        hero_image_url: { type: string, nullable: true }
        is_active: { type: boolean }
        founded_year: { type: integer, nullable: true }
        member_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, slug, country, region, primary_language, supported_languages, timezone, currency, contact_email, is_active, created_at, updated_at]
    ChapterCreateRequest:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        country: { type: string }
        region: { type: string }
        description: { type: string, nullable: true }
        description_local: { type: string, nullable: true }
        primary_language: { type: string }
        supported_languages:
          type: array
          items: { type: string }
        timezone: { type: string }
        currency: { type: string }
        contact_email:
          type: string
          format: email
        website_url: { type: string, nullable: true }
        logo_url: { type: string, nullable: true }
        hero_image_url: { type: string, nullable: true }
        is_active: { type: boolean, default: false }
        founded_year: { type: integer, nullable: true }
        member_count: { type: integer, nullable: true }
      required: [name, slug, country, region, primary_language, supported_languages, timezone, currency, contact_email]
    ChapterUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ChapterCreateRequest'
    ChapterPatchRequest:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        country: { type: string }
        region: { type: string }
        description: { type: string }
        description_local: { type: string }
        primary_language: { type: string }
        supported_languages:
          type: array
          items: { type: string }
        timezone: { type: string }
        currency: { type: string }
        contact_email:
          type: string
          format: email
        website_url: { type: string }
        logo_url: { type: string }
        hero_image_url: { type: string }
        is_active: { type: boolean }
        founded_year: { type: integer }
        member_count: { type: integer }
    ChapterContentUpdateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        description_local: { type: string }
        primary_language: { type: string }
        supported_languages:
          type: array
          items: { type: string }
        timezone: { type: string }
        currency: { type: string }
        website_url: { type: string }
        logo_url: { type: string }
        hero_image_url: { type: string }
        is_active: { type: boolean }
        founded_year: { type: integer }
        member_count: { type: integer }
    ChapterListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
      required: [data, page, page_size, total]
    Coach:
      type: object
      properties:
        id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email:
          type: string
          format: email
        phone: { type: string, nullable: true }
        profile_image_url: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        specializations:
          type: array
          items: { type: string }
        languages:
          type: array
          items: { type: string }
        country: { type: string }
        city: { type: string, nullable: true }
        chapter_id: { type: string, nullable: true }
        chapter_name: { type: string, nullable: true }
        certification_level: { type: string }
        certification_date: { type: string, format: date-time }
        is_active: { type: boolean }
        linkedin_url: { type: string, nullable: true }
        website_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, first_name, last_name, email, specializations, languages, country, certification_level, certification_date, is_active, created_at, updated_at]
    CoachCreateRequest:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email:
          type: string
          format: email
        phone: { type: string, nullable: true }
        profile_image_url: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        specializations:
          type: array
          items: { type: string }
        languages:
          type: array
          items: { type: string }
        country: { type: string }
        city: { type: string, nullable: true }
        chapter_id: { type: string, nullable: true }
        certification_level: { type: string }
        certification_date: { type: string, format: date-time }
        is_active: { type: boolean, default: false }
        linkedin_url: { type: string, nullable: true }
        website_url: { type: string, nullable: true }
      required: [first_name, last_name, email, country, certification_level, certification_date]
    CoachListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Coach'
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
      required: [data, page, page_size, total]
    Event:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        title_local: { type: string, nullable: true }
        description: { type: string, nullable: true }
        description_local: { type: string, nullable: true }
        event_type: { type: string }
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time, nullable: true }
        timezone: { type: string }
        location_type: { type: string }
        venue_name: { type: string, nullable: true }
        venue_address: { type: string, nullable: true }
        online_meeting_url: { type: string, nullable: true }
        chapter_id: { type: string }
        chapter_name: { type: string, nullable: true }
        max_attendees: { type: integer, nullable: true }
        current_attendees: { type: integer }
        price_amount: { type: number, format: double, nullable: true }
        price_currency: { type: string, nullable: true }
        is_free: { type: boolean }
        registration_deadline: { type: string, format: date-time, nullable: true }
        status: { type: string }
        image_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, title, event_type, start_date, timezone, location_type, chapter_id, current_attendees, is_free, status, created_at, updated_at]
    EventCreateRequest:
      type: object
      properties:
        title: { type: string }
        title_local: { type: string, nullable: true }
        description: { type: string, nullable: true }
        description_local: { type: string, nullable: true }
        event_type: { type: string }
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time, nullable: true }
        timezone: { type: string }
        location_type: { type: string }
        venue_name: { type: string, nullable: true }
        venue_address: { type: string, nullable: true }
        online_meeting_url: { type: string, nullable: true }
        chapter_id: { type: string }
        max_attendees: { type: integer, nullable: true }
        price_amount: { type: number, format: double, nullable: true }
        price_currency: { type: string, nullable: true }
        is_free: { type: boolean, default: false }
        registration_deadline: { type: string, format: date-time, nullable: true }
        status: { type: string }
        image_url: { type: string, nullable: true }
